name: Windows VST3
on:
  push:
    branches: [main]
    paths: ['Source/**', 'tests/**', 'Assets/**', 'CMakeLists.txt', 'FractalLab-v02b-source.zip', '.github/workflows/windows-vst3.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import uploaded source archive
        shell: pwsh
        run: |
          if (!(Test-Path CMakeLists.txt)) {
            Expand-Archive -LiteralPath FractalLab-v02b-source.zip -DestinationPath source-import
            Get-ChildItem source-import/FractalLab-v02b -Force | Where-Object Name -ne '.github' | Copy-Item -Destination . -Recurse
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Source Assets tests CMakeLists.txt CMakePresets.json CONCEPT.md README.md SOURCE_CHECKS.json TEST_REPORT.md .gitignore
            git commit -m "Import JUCE GUI sources and design assets"
            git push
          }
      - name: Configure Windows x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel 4
      - name: Run engine, processor, math and GUI tests
        run: ctest --test-dir build -C Release --output-on-failure --output-junit test-results.xml
      - name: Package complete VST3 bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          $bundle = "build/FractalLabV02b_artefacts/Release/VST3/FRACTAL LAB MANDELBROT v0.2b.vst3"
          if (!(Test-Path "$bundle/Contents/x86_64-win/FRACTAL LAB MANDELBROT v0.2b.vst3")) { throw "Expected Windows VST3 binary missing" }
          Copy-Item -LiteralPath $bundle -Destination package -Recurse
          @'
          FRACTAL LAB MANDELBROT v0.2b - Windows x64 VST3
          Extract the ZIP. Copy the complete .vst3 folder to:
          C:\Program Files\Common Files\VST3
          Rescan VST3 plugins in Ableton Live, then load FRACTAL LAB MANDELBROT v0.2b.
          Keep your installed MANDELBROT MIDI v0.2a for fallback.
          This MIDI-generating plugin has silent audio output; route its MIDI to an instrument as with v0.2a.
          APC20 mappings are configured in the host. Practical Ableton/APC20 testing remains pending.
          Build and automated tests passed before this package was created.
          '@ | Set-Content package/INSTALL.txt
          Get-FileHash -LiteralPath "$bundle/Contents/x86_64-win/FRACTAL LAB MANDELBROT v0.2b.vst3" | Format-List | Out-File package/SHA256.txt
          Compress-Archive -Path package/* -DestinationPath FRACTAL-LAB-MANDELBROT-v0.2b-Windows-x64-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FRACTAL-LAB-MANDELBROT-v0.2b-Windows-x64-VST3
          path: FRACTAL-LAB-MANDELBROT-v0.2b-Windows-x64-VST3.zip
          if-no-files-found: error
      - name: Publish Ableton test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2b-preview
          name: FRACTAL LAB v0.2b - Windows VST3 test build
          prerelease: true
          body: |
            Windows x64 VST3 bundle for testing in Ableton Live.
            Release build and engine, processor, view-math and GUI attachment tests passed.
            Practical Ableton/APC20 testing is pending. v0.2a remains separate.
          files: FRACTAL-LAB-MANDELBROT-v0.2b-Windows-x64-VST3.zip
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            build/test-results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
